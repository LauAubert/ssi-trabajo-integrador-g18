# Mosquitto - CONFIGURACION INSEGURA (solo laboratorio / demo)
# ------------------------------------------------------------
# Representa la mala practica mas comun en despliegues IoT/IIoT:
# broker abierto, sin TLS y con acceso anonimo. Es lo que permite
# el sniffing y la inyeccion que mostramos en la demo.
#
# NO USAR EN PRODUCCION. Ver mosquitto-secure.conf.

listener 1883 0.0.0.0
allow_anonymous true          # <-- cualquiera se conecta sin credenciales

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all
