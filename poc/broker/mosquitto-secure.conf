# Mosquitto - CONFIGURACION ENDURECIDA (mitigacion)
# ------------------------------------------------------------
# Cierra las vulnerabilidades mostradas en la demo:
#   1. TLS en el puerto 8883  -> el trafico deja de viajar en claro,
#      el sniffer ya no puede leer los payloads.
#   2. Autenticacion por usuario/password -> se elimina el acceso
#      anonimo; un atacante sin credenciales no puede conectarse.
#   3. ACL por usuario/topic -> aunque un cliente se autentique,
#      solo puede publicar/suscribir en los topics que le
#      corresponden (principio de minimo privilegio).
#
# Preparacion (ver ../mitigations/README.md para el detalle):
#   mosquitto_passwd -c passwd esp32
#   mosquitto_passwd    passwd scada
#   (generar certs en ./certs con el script de mitigations)

# Se deshabilita el puerto plano: solo TLS.
listener 8883 0.0.0.0
allow_anonymous false

# --- TLS ---
cafile   /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile  /mosquitto/config/certs/server.key
tls_version tlsv1.2

# --- Autenticacion ---
password_file /mosquitto/config/passwd

# --- Autorizacion (ACL) ---
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all
