<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2933">SSI · Grupo 18 — Diagrama de conexión (ESP32 · nodo IIoT)</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#5b6b79">Sensor ultrasónico HC-SR04 · Servo SG90 (válvula) · LED de estado · Buzzer de alarma</text>

  <!-- ================= ESP32 ================= -->
  <rect x="90" y="150" width="190" height="400" rx="12" fill="#1f2933"/>
  <text x="185" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">ESP32</text>
  <text x="185" y="200" text-anchor="middle" font-size="12" fill="#9fb0bd">DevKit v1</text>

  <!-- pads ESP32 (lado derecho) -->
  <!-- 5V -->
  <circle cx="280" cy="240" r="6" fill="#e53935"/>
  <text x="268" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#ffd3d1">5V / VIN</text>
  <!-- GND -->
  <circle cx="280" cy="275" r="6" fill="#111"/>
  <text x="268" y="271" text-anchor="end" font-size="13" font-weight="700" fill="#cfd8dc">GND</text>
  <!-- D5 TRIG -->
  <circle cx="280" cy="330" r="6" fill="#fbc02d"/>
  <text x="268" y="326" text-anchor="end" font-size="13" font-weight="700" fill="#ffe9a6">GPIO13</text>
  <!-- D18 ECHO -->
  <circle cx="280" cy="380" r="6" fill="#fb8c00"/>
  <text x="268" y="376" text-anchor="end" font-size="13" font-weight="700" fill="#ffd9ab">GPIO34</text>
  <!-- D13 SERVO -->
  <circle cx="280" cy="435" r="6" fill="#1e88e5"/>
  <text x="268" y="431" text-anchor="end" font-size="13" font-weight="700" fill="#bbdcfb">GPIO14</text>
  <!-- D2 LED -->
  <circle cx="280" cy="480" r="6" fill="#43a047"/>
  <text x="268" y="476" text-anchor="end" font-size="13" font-weight="700" fill="#bfe6c2">GPIO27</text>
  <!-- D14 BUZZER -->
  <circle cx="280" cy="525" r="6" fill="#8e24aa"/>
  <text x="268" y="521" text-anchor="end" font-size="13" font-weight="700" fill="#e3bdee">GPIO26</text>

  <!-- ================= Wires (señales) ================= -->
  <!-- TRIG D5 -> HC-SR04 -->
  <path d="M280 330 H430 V215 H600" fill="none" stroke="#fbc02d" stroke-width="3"/>
  <!-- ECHO HC-SR04 -> divisor -> D18 -->
  <path d="M600 245 H520 V380 H470" fill="none" stroke="#fb8c00" stroke-width="3"/>
  <path d="M400 380 H280" fill="none" stroke="#fb8c00" stroke-width="3"/>
  <!-- SERVO D13 -->
  <path d="M280 435 H600" fill="none" stroke="#1e88e5" stroke-width="3"/>
  <!-- LED D2 -->
  <path d="M280 480 H600" fill="none" stroke="#43a047" stroke-width="3"/>
  <!-- BUZZER D14 -->
  <path d="M280 525 H600" fill="none" stroke="#8e24aa" stroke-width="3"/>

  <!-- Divisor de tensión (ECHO 5V -> 3.3V) -->
  <rect x="400" y="358" width="70" height="44" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="435" y="375" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e65100">DIVISOR</text>
  <text x="435" y="390" text-anchor="middle" font-size="10" fill="#e65100">1kΩ / 2kΩ</text>

  <!-- ================= Componentes (tarjetas) ================= -->
  <!-- HC-SR04 -->
  <rect x="600" y="175" width="320" height="110" rx="10" fill="#eef3f6" stroke="#b0bec5"/>
  <text x="616" y="200" font-size="15" font-weight="700" fill="#1f2933">HC-SR04 · Ultrasonido (sensor de "nivel")</text>
  <circle cx="600" cy="215" r="5" fill="#fbc02d"/><text x="616" y="222" font-size="12.5" fill="#37474f">Trig → GPIO13</text>
  <circle cx="600" cy="245" r="5" fill="#fb8c00"/><text x="616" y="252" font-size="12.5" fill="#37474f">Echo → divisor → GPIO34 (solo-entrada)</text>
  <text x="616" y="275" font-size="12.5" fill="#37474f"><tspan fill="#c62828" font-weight="700">Vcc → 5V (VIN)</tspan>   ·   <tspan font-weight="700">Gnd → GND</tspan></text>

  <!-- Servo -->
  <rect x="600" y="400" width="320" height="75" rx="10" fill="#eef3f6" stroke="#b0bec5"/>
  <text x="616" y="423" font-size="15" font-weight="700" fill="#1f2933">Servo SG90 · "Válvula"</text>
  <circle cx="600" cy="438" r="5" fill="#1e88e5"/><text x="616" y="445" font-size="12.5" fill="#37474f">Naranja (señal) → GPIO14</text>
  <text x="616" y="466" font-size="12.5" fill="#37474f"><tspan fill="#c62828" font-weight="700">Rojo → 5V (VIN)</tspan>   ·   <tspan font-weight="700">Marrón → GND</tspan></text>

  <!-- LED + Buzzer -->
  <rect x="600" y="490" width="320" height="95" rx="10" fill="#eef3f6" stroke="#b0bec5"/>
  <text x="616" y="513" font-size="15" font-weight="700" fill="#1f2933">Actuadores de aviso</text>
  <circle cx="600" cy="528" r="5" fill="#43a047"/><text x="616" y="535" font-size="12.5" fill="#37474f">LED: GPIO27 → 220Ω → ánodo(+) ; cátodo(−) → GND</text>
  <circle cx="600" cy="558" r="5" fill="#8e24aa"/><text x="616" y="565" font-size="12.5" fill="#37474f">Buzzer activo: GPIO26 → (+) ; (−) → GND</text>

  <!-- ================= Notas ================= -->
  <rect x="90" y="600" width="830" height="100" rx="10" fill="#fffde7" stroke="#fbc02d"/>
  <text x="106" y="623" font-size="13.5" font-weight="700" fill="#5d4037">Notas de montaje</text>
  <text x="106" y="645" font-size="12.5" fill="#5d4037">• <tspan font-weight="700">Divisor en ECHO:</tspan> el HC-SR04 saca 5V y el ESP32 es de 3.3V. Echo→R1(1kΩ)→GPIO34, y GPIO34→R2(2kΩ)→GND.</text>
  <text x="106" y="665" font-size="12.5" fill="#5d4037">• <tspan font-weight="700">Alimentación:</tspan> servo y sensor a 5V (VIN por USB). Si el servo tironea o resetea el ESP32, usar fuente 5V aparte y <tspan font-weight="700">unir los GND</tspan>.</text>
  <text x="106" y="685" font-size="12.5" fill="#5d4037">• <tspan font-weight="700">Pines:</tspan> todos sobre la hilera libre (lado VIN). Se evitan CMD/SD2/SD3 (flash) y EN. El LED externo necesita su 220Ω (GPIO2 onboard no queda accesible).</text>
</svg>
